[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "singing-vocoders"
version = "0.1.0"
description = "Fabric-native training framework for singing voice vocoders"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "OpenVPI" }]
dependencies = [
  "click==8.4.2",
  "einops==0.8.2",
  "librosa==0.11.0",
  "lightning-fabric==2.6.5",
  "numpy==1.26.4",
  "omegaconf==2.3.1",
  "praat-parselmouth==0.4.7",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "setuptools==80.9.0",
  "soundfile==0.14.0",
  "tensorboard==2.21.0",
  "torch==2.9.1",
  "torchaudio==2.9.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.10",
  "types-PyYAML==6.0.12.20250915",
]

[project.scripts]
vocoder = "singing_vocoders.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
singing_vocoders = ["py.typed", "recipes/*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "src/singing_vocoders/models",
  "src/singing_vocoders/modules",
  "src/singing_vocoders/utils",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["singing_vocoders"]

[[tool.mypy.overrides]]
module = [
  "librosa.*",
  "parselmouth.*",
  "pyworld.*",
  "soundfile.*",
  "tensorboard.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "singing_vocoders.models.*",
  "singing_vocoders.modules.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "singing_vocoders.components.builtin"
disable_error_code = ["no-untyped-call", "override"]
