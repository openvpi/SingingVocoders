model:
  generator:
    target: nsf_hifigan
    params:
      sampling_rate: ${data.features.sample_rate}
      num_mels: ${data.features.num_mels}
      hop_size: ${data.features.hop_size}
      mini_nsf: false
      noise_sigma: 0
      upsample_rates: [8, 8, 2, 2, 2]
      upsample_kernel_sizes: [16, 16, 4, 4, 4]
      upsample_initial_channel: 512
      resblock_kernel_sizes: [3, 7, 11]
      resblock_dilation_sizes:
        - [1, 3, 5]
        - [1, 3, 5]
        - [1, 3, 5]
      resblock: "1"
