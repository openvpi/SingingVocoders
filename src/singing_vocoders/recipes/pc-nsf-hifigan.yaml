bases: [nsf-hifigan.yaml]
name: pc-nsf-hifigan
data:
  crop_frames: 32
  batch_size: 3
augmentation:
  pc_enabled: true
  pc_probability: 0.4
  pc_key_range: 12
model:
  generator:
    params:
      mini_nsf: true
      noise_sigma: 0
optimization:
  generator:
    optimizers:
      - parameters: all
        optimizer:
          name: adamw
          lr: 0.00001
          betas: [0.8, 0.99]
    clip_grad_norm: 1
  discriminator:
    optimizers:
      - parameters: all
        optimizer:
          name: adamw
          lr: 0.00001
          betas: [0.8, 0.99]
    clip_grad_norm: 1
runtime:
  validate_every: 2000
  checkpoint_every: 2000
