bases: [ddspgan.yaml]
name: lvc-ddspgan
model:
  generator:
    target: lvc_ddspgan
    params:
      noise_channels: 8
      hidden_channels: 8
      block_count: 3
      layers_per_block: 10
      convolution_kernel_size: 7
      kernel_predictor_hidden_channels: 128
      kernel_predictor_kernel_size: 3
      kernel_predictor_dropout: 0
      conditioning_upsample_factor: 2
runtime:
  max_steps: 800000
