bases: [_common.yaml, _warmup-1e4.yaml]
name: hifivae
data:
  crop_frames: 22
  batch_size: 6
augmentation:
  volume_probability: 0.7
model:
  generator:
    target: hifivae
    params:
      latent_channels: 192
      hop_size: ${data.features.hop_size}
      upsample_rates: [8, 8, 2, 2, 2]
      upsample_kernel_sizes: [16, 16, 4, 4, 4]
      upsample_initial_channel: 512
      resblock_kernel_sizes: [3, 7, 11]
      resblock_dilation_sizes:
        - [1, 3, 5]
        - [1, 3, 5]
        - [1, 3, 5]
      resblock: "1"
  discriminators:
    msd:
      target: msd
    mpd:
      target: mpd
      params:
        periods: [3, 5, 7, 11, 17, 23, 37]
objective:
  name: hifivae
  stft_weight: 2.5
  kl_weight: 0.02
  waveform_weight: 0
  feature_weight: 1
  adversarial_weight: 1
optimization:
  aux_steps: 16000
runtime:
  seed: 1234
  max_steps: 5000000
  validate_every: 4000
  checkpoint_every: 4000
