bases: [_common.yaml, _alternating-1e4.yaml]
name: ddspgan
model:
  generator:
    target: ddspgan
    params:
      sample_rate: ${data.features.sample_rate}
      num_mels: ${data.features.num_mels}
      hop_size: ${data.features.hop_size}
      win_size: ${data.features.win_size}
      type: CombSub
      use_mean_filter: true
      n_mag_harmonic: 512
      n_mag_noise: 256
  discriminators:
    msd:
      target: msd
    mpd:
      target: mpd
      params:
        periods: [3, 5, 7, 11, 17, 23, 37]
objective:
  name: ddsp
  aux_weight: 45
  feature_weight: 1
  adversarial_weight: 1
