bases: [_univ.yaml]
name: ddsp-univnet
model:
  generator:
    target: ddsp_univnet
    params:
      type: CombSub
      n_mag_harmonic: 512
      n_mag_noise: 256
  discriminators:
    mrd:
      target: mrd
      params:
        fft_sizes: [1024, 2048, 512]
        hop_sizes: [120, 240, 50]
        win_lengths: [600, 1200, 240]
    mpd:
      target: univ_mpd
      params:
        periods: [3, 5, 7, 11, 17, 23, 37]
objective:
  name: ddsp_univnet
  aux_weight: 2.5
  stft:
    fft_sizes: [2048, 2048, 4096, 1024, 512, 256, 128]
    hop_sizes: [512, 240, 480, 100, 50, 25, 12]
    win_lengths: [2048, 1200, 2400, 480, 240, 120, 60]
  ddsp_weight: 2
  rss_fft_min: 256
  rss_fft_max: 2048
  rss_scales: 4
  uv_weight: 1
  uv_detach_steps: 2000
  feature_weight: 1
  adversarial_weight: 1
