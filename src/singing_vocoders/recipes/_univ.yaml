bases: [_common.yaml, _warmup-2e4.yaml]
data:
  batch_size: 10
model:
  generator:
    params:
      sample_rate: ${data.features.sample_rate}
      num_mels: ${data.features.num_mels}
      hop_size: ${data.features.hop_size}
      win_size: ${data.features.win_size}
      use_weight_norm: true
      waveform_upsample_rates: [8, 8, 4]
      noise_channels: 128
      output_channels: 1
      hidden_channels: 32
      lvc_layers_per_block: 4
      lvc_kernel_size: 5
      kernel_predictor_hidden_channels: 96
      kernel_predictor_kernel_size: 3
      kernel_predictor_dropout: 0
      mel_upsample_factor: 2
runtime:
  max_steps: 800000
  validate_every: 8000
  checkpoint_every: 8000
