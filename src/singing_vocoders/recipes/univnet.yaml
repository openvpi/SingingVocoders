bases: [_univ.yaml]
name: univnet
model:
  generator:
    target: univnet
  discriminators:
    mrd:
      target: mrd
      params:
        fft_sizes: [1024, 2048, 512]
        hop_sizes: [120, 240, 50]
        window_lengths: [600, 1200, 240]
    mpd:
      target: univ_mpd
      params:
        periods: [3, 5, 7, 11, 17, 23, 37]
objective:
  name: univnet
  aux_weight: 2.5
  feature_weight: 1
  adversarial_weight: 1
